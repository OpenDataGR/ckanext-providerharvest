# Local Docker Compose replica of data.gov.gr's CKAN 2.11.3 environment,
# used to verify the parts of ckanext-providerharvest that need a real
# CKAN instance (model layer, logic/action.py, logic/auth.py,
# harvesters/base_generic.py, plugin.py -- see README.md and DESIGN.md's
# "Deployment Model" / "Verification" sections).
#
# Modeled on the official ckan/ckan-docker reference compose file
# (https://github.com/ckan/ckan-docker), adapted to: use xloader instead
# of datapusher, add ckanext-harvest + a queue-consumer worker service,
# add ckanext-scheming/-dcat/-fluent, and build ckanext-providerharvest
# itself into the image from this repo checkout instead of pulling it
# from a registry.
#
# Usage: see README.md's "Local Docker replica" section.

volumes:
  ckan_storage:
  pg_data:
  solr_data:

services:

  ckan:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/ckan/Dockerfile
    image: ckanext-providerharvest-ckan:local
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      solr:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CKAN_PORT_HOST:-5000}:5000"
    volumes:
      - ckan_storage:/var/lib/ckan
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:5000/api/action/status_show"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  ckan-worker:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/ckan/Dockerfile
    image: ckanext-providerharvest-ckan:local
    command: ["/srv/app/worker-entrypoint.sh"]
    env_file:
      - .env
    depends_on:
      ckan:
        condition: service_healthy
    volumes:
      - ckan_storage:/var/lib/ckan
    restart: unless-stopped

  db:
    build:
      context: postgresql/
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  solr:
    platform: linux/amd64
    image: ckan/ckan-solr:${SOLR_IMAGE_VERSION:-2.11-solr9}
    ports:
      - "127.0.0.1:${SOLR_PORT_HOST:-8983}:8983"
    volumes:
      - solr_data:/var/solr
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8983/solr/ckan/select"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: "redis:${REDIS_VERSION:-7-alpine}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Throwaway mock HTTP provider for the end-to-end harvest-job
  # integration test (ckanext/providerharvest/tests/integration/) --
  # DESIGN.md's "Verification" section calls for one mock HTTP provider.
  # Not something a real provider registration would ever point at.
  mock-provider:
    image: "python:${MOCK_PROVIDER_PYTHON_VERSION:-3.12-alpine}"
    volumes:
      - ./mock-provider/serve.py:/serve.py:ro
    command: ["python3", "/serve.py"]
    restart: unless-stopped

  # Throwaway mock SFTP provider for the Phase 1.5 SFTP/bulk_file
  # end-to-end test -- a real OpenSSH server with a fixed set of files
  # under sftp-provider/upload/ (bind-mounted read-only into the sftp
  # user's chroot), exercising SFTPTransport's real paramiko connect/
  # host-key/auth/listing path, not a fake. atmoz/sftp requires the
  # user's home dir to be root-owned for the chroot, but "upload" (a
  # subdirectory of it) is exempt from that and is what gets mounted.
  # Not something a real provider registration would ever point at.
  sftp-provider:
    image: "atmoz/sftp:${SFTP_PROVIDER_IMAGE_VERSION:-alpine}"
    volumes:
      - ./sftp-provider/upload:/home/produser/upload:ro
    command: ["produser:${SFTP_PROVIDER_PASSWORD:-test-pass}:1001:1001:upload"]
    restart: unless-stopped
