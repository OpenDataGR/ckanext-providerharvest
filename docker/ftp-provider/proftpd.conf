# Minimal proftpd config for the throwaway plain-FTP test server -- see
# this directory's Dockerfile for why ProFTPD (not vsftpd, which was
# tried first and confirmed via CI to reject MLSD).
ServerName "ftp-provider"
ServerType standalone
DefaultAddress 0.0.0.0
Port 21
Umask 022
MaxInstances 30
User produser
Group produser
# The test user's shell is /sbin/nologin (never used interactively,
# only for FTP auth) -- proftpd otherwise refuses login for any user
# whose shell isn't listed in /etc/shells.
RequireValidShell off
DefaultRoot ~
PassivePorts 21100 21110
# No TLS config -- see the Dockerfile/module docstring for why this
# server is plain FTP only.
