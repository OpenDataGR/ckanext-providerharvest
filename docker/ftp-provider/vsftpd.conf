# Minimal vsftpd config for the throwaway plain-FTP test server -- see
# this directory's Dockerfile for why plain FTP, not FTPS.
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=NO
chroot_local_user=YES
local_root=/home/produser
allow_writeable_chroot=YES
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
# No pasv_address set -- defaults to the control connection's own local
# address, which is exactly the container's own IP as seen by another
# container on the same docker-compose network (no NAT translation to
# work around here, unlike a container behind a host's public IP).
seccomp_sandbox=NO
